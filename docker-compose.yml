services:

  backend:
    build:
      context: ./oiltrace-backend
      dockerfile: Dockerfile
    container_name: oiltrace-backend
    ports:
      - "8001:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: oiltrace-frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
    restart: unless-stopped