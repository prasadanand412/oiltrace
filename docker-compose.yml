services:

  backend:
    build:
      context: .
      dockerfile: oiltrace-backend/Dockerfile
    container_name: oiltrace-backend
    ports:
      - "8001:8000"
    environment:
      OILTRACE_DB_PATH: /app/data/oiltrace.db
    volumes:
      - oiltrace-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: oiltrace-frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  oiltrace-data:
