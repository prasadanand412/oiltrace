name: OilTrace Backend CI

on:
  push:
    branches:
      - feature/docker-render
  pull_request:
    branches:
      - feature/docker-render

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: oiltrace-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m compileall .

      - name: Build Docker image
        working-directory: .
        run: |
          docker build -t oiltrace-backend ./oiltrace-backend

      - name: Verify Docker image
        run: |
          docker image inspect oiltrace-backend